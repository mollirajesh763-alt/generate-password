<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strong Password Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px auto;
            max-width: 400px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        .checkbox-group label {
            display: inline;
            margin-left: 5px;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 20px;
            padding: 10px;
            background: #faf5f5;
            border: 1px dashed #f00404;
            word-break: break-all;
            font-family: monospace;
            font-size: 16px;
            min-height: 24px;
        }
        .strength-container {
            margin-top: 15px;
            display: none;
        }
        .strength-text {
            font-weight: bold;
            font-size: 16px;
        }
        .red { color: #eb0f0f; }
        .orange { color: #ffa500; }
        .green { color: #2ecc71; }
    </style>
</head>
<body>

    <h2>Password Generator</h2>
    
    <div class="form-group">
        <label for="length">Password Length:</label>
        <input type="number" id="length" value="12" min="4" max="50">
    </div>

    <div class="form-group checkbox-group">
        <div>
            <input type="checkbox" id="uppercase" checked>
            <label for="uppercase">Uppercase Letters (A-Z)</label>
        </div>
        <div>
            <input type="checkbox" id="lowercase" checked>
            <label for="lowercase">Lowercase Letters (a-z)</label>
        </div>
        <div>
            <input type="checkbox" id="numbers" checked>
            <label for="numbers">Numbers (0-9)</label>
        </div>
        <div>
            <input type="checkbox" id="punctuation" checked>
            <label for="punctuation">Punctuation Marks (#, @, etc.)</label>
        </div>
    </div>

    <button onclick="generatePassword()">Generate Password</button>

    <div class="result-box" id="passwordResult">Your generated password will appear here...</div>

    <div class="strength-container" id="strengthContainer">
        Password Strength: <span id="strengthText" class=""></span>
    </div>

    <script>
        function generatePassword() {
            const length = parseInt(document.getElementById('length').value);
            const useUpper = document.getElementById('uppercase').checked;
            const useLower = document.getElementById('lowercase').checked;
            const useNumbers = document.getElementById('numbers').checked;
            const usePunctuation = document.getElementById('punctuation').checked;

            const upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const lowerChars = "abcdefghijklmnopqrstuvwxyz";
            const numberChars = "0123456789";
            const punctuationChars = "!@#\$%^&*()_+~`|}{[]:;?><,./-=";

            let charPool = "";
            let guaranteedChars = [];
            let typesCount = 0;

            if (useUpper) {
                charPool += upperChars;
                guaranteedChars.push(upperChars[Math.floor(Math.random() * upperChars.length)]);
                typesCount++;
            }
            if (useLower) {
                charPool += lowerChars;
                guaranteedChars.push(lowerChars[Math.floor(Math.random() * lowerChars.length)]);
                typesCount++;
            }
            if (useNumbers) {
                charPool += numberChars;
                guaranteedChars.push(numberChars[Math.floor(Math.random() * numberChars.length)]);
                typesCount++;
            }
            if (usePunctuation) {
                charPool += punctuationChars;
                guaranteedChars.push(punctuationChars[Math.floor(Math.random() * punctuationChars.length)]);
                typesCount++;
            }

            if (charPool === "") {
                alert("Please select at least one option!");
                return;
            }

            let generatedPassword = "";
            
            // Add the guaranteed characters first to ensure options are respected
            for (let i = 0; i < guaranteedChars.length && i < length; i++) {
                generatedPassword += guaranteedChars[i];
            }

            // Fill the rest of the password length
            for (let i = generatedPassword.length; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * charPool.length);
                generatedPassword += charPool[randomIndex];
            }

            // Shuffle the password so guaranteed characters aren't always at the start
            generatedPassword = generatedPassword.split('').sort(() => 0.5 - Math.random()).join('');

            // Display password
            document.getElementById('passwordResult').innerText = generatedPassword;

            // Calculate strength percentage based on length and variety
            let strengthScore = 0;
            
            // Length points (up to 40%)
            if (length >= 12) strengthScore += 40;
            else if (length >= 8) strengthScore += 25;
            else strengthScore += 10;

            // Variety points (up to 60%)
            strengthScore += (typesCount * 15);

            // Cap at 100
            if (strengthScore > 100) strengthScore = 100;

            // Determine label and color
            let label = "";
            let colorClass = "";

            if (strengthScore < 50) {
                label = `Easy (${strengthScore}%)`;
                colorClass = "red";
            } else if (strengthScore >= 50 && strengthScore < 80) {
                label = `Medium (${strengthScore}%)`;
                colorClass = "orange";
            } else {
                label = `Hard (${strengthScore}%)`;
                colorClass = "green";
            }

            // Update UI
            const strengthText = document.getElementById('strengthText');
            strengthText.innerText = label;
            strengthText.className = "strength-text " + colorClass;
            document.getElementById('strengthContainer').style.display = "block";
        }
    </script>
</body>
</html>
